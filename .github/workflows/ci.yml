name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: cd backend && uv sync
      - run: make lint
      - run: make test-backend

  client-core:
    name: Client (TraccioCore tests)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: make test-core
