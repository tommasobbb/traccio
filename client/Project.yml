# XcodeGen spec for the Traccio app. The .xcodeproj is generated from this file
# and is gitignored — edit here and run `make xcode`, never edit the project.
#
# The app target holds views, navigation, and platform wiring only. All models,
# the API client, and formatting live in the local TraccioCore package
# (Packages/TraccioCore), which builds and tests without Xcode.
name: Traccio

options:
  bundleIdPrefix: com.traccio
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  TraccioCore:
    path: Packages/TraccioCore

targets:
  Traccio:
    type: application
    # One target builds for both platforms; SwiftUI + platform checks handle
    # the differences in code rather than in two near-duplicate targets.
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App/Sources
      - path: App/Resources
        buildPhase: resources
    dependencies:
      - package: TraccioCore
    # Generated Info.plist (gitignored, like the .xcodeproj — run `make xcode`).
    # Non-default content: the ATS exception below (the M0 app talks to the
    # dev backend over http://localhost, and the iOS simulator blocks
    # cleartext HTTP without NSAllowsLocalNetworking; dev-only, no production
    # endpoint is cleartext), NSFaceIDUsageDescription, required by iOS to
    # evaluate .deviceOwnerAuthentication with Face ID (biometric lock,
    # docs/decisions/0013-biometric-lock.md; unconditional even though the
    # feature is iOS-only, since macOS never reads this key), and
    # UILaunchScreen (iOS-only concept, harmless to declare unconditionally
    # for the same reason) — Palette.background behind the same bar-chart
    # mark as the app icon (App/Resources/Assets.xcassets/LaunchMark.imageset),
    # rather than a storyboard. Italian, matching the client's Italian-only
    # UI (tasks/backlog.md).
    info:
      path: App/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSFaceIDUsageDescription: "Traccio usa Face ID per sbloccare l'app e proteggere i tuoi dati finanziari."
        UILaunchScreen:
          UIColorName: "Background"
          UIImageName: "LaunchMark"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.traccio.app
        MARKETING_VERSION: "0.0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        # AppIcon.appiconset and AccentColor.colorset (App/Resources/Assets.xcassets,
        # App/Resources/Colors.xcassets) — a real icon instead of the default
        # blank one, and a system accent tint matching Palette.accent.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Palette reads every asset by string name (Color("Ink", bundle: .main),
        # …), never a generated symbol — this codegen output goes unused.
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOLS: NO
        # No Apple Developer team configured yet (paid membership is a
        # deferred M3 item, `tasks/backlog.md`) and a free personal team is
        # extra setup for a purely local run. macOS doesn't need a signing
        # identity to run a Debug build launched from Xcode, so skip signing
        # for the macOS destination only — iOS device builds still require
        # (and will still request) a real team.
        CODE_SIGNING_ALLOWED[sdk=macosx*]: "NO"
        CODE_SIGNING_REQUIRED[sdk=macosx*]: "NO"
    # Wires TraccioTests into the Traccio scheme's test action, so
    # `xcodebuild test -scheme Traccio` (make test-app) runs it.
    scheme:
      testTargets:
        - TraccioTests

  # View-model tests for App/ — the seam `.claude/rules/swift.md` asks for
  # (`APIClientProtocol` + a fake) needed a target to run in; this is it.
  # Deliberately separate from `make test`/`make test-core`, which stay
  # Xcode-free (`client/CLAUDE.md`) — see `make test-app`.
  TraccioTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App/Tests
    dependencies:
      - target: Traccio
      - package: TraccioCore
    settings:
      base:
        SWIFT_VERSION: "6.0"
        # See the same keys on the Traccio target above: no Apple Developer
        # team configured yet, and macOS doesn't need one to run tests
        # launched from Xcode.
        CODE_SIGNING_ALLOWED[sdk=macosx*]: "NO"
        CODE_SIGNING_REQUIRED[sdk=macosx*]: "NO"
        # XcodeGen's default TEST_HOST/BUNDLE_LOADER assume an iOS-style
        # bundle layout (`Traccio.app/Traccio`); a macOS app's executable
        # lives at `Traccio.app/Contents/MacOS/Traccio` instead. This
        # multiplatform target needs both: the plain keys (iOS default) stay,
        # and the `[sdk=macosx*]`-suffixed keys below override them only when
        # building for macOS, so `make test-app` (macOS) and an iOS
        # simulator run both find the right host.
        TEST_HOST[sdk=macosx*]: "$(BUILT_PRODUCTS_DIR)/Traccio.app/Contents/MacOS/Traccio"
        BUNDLE_LOADER[sdk=macosx*]: "$(TEST_HOST)"
