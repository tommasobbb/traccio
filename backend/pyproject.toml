[project]
name = "traccio"
version = "0.1.0"
description = "Backend di traccio: aggregazione conti e tracking spese"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "httpx>=0.28",
    "structlog>=25.1",
    "psycopg[binary]>=3.3.4",
    "cryptography>=50.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/traccio"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put src/ on sys.path directly so test imports never depend on the editable
# install. This survives the intermittent _virtualenv.pth interference that
# otherwise drops the editable src entry (see backend/CLAUDE.md).
# scripts/ is also here so tests/test_repair_empty_transaction_fields.py can
# import repair_empty_transaction_fields.plan_repair directly — it writes to
# production data, so unlike the other operational scripts it earns a test.
pythonpath = ["src", "scripts"]
asyncio_mode = "auto"
addopts = "-q"
