# Fly.io app config (docs/decisions/0015-deploy-fly-io.md). Deploy from
# backend/: `fly deploy --config fly.toml`.
app = "<your-app>"
# Fly has no Italy region; fra (Frankfurt) is the closest European hub.
primary_region = "fra"

[build]

[env]
TRACCIO_ENVIRONMENT = "production"
TRACCIO_LOG_LEVEL = "INFO"
TRACCIO_LOG_JSON = "true"
TRACCIO_ENABLE_BANKING_REDIRECT_URL = "https://<your-app>.fly.dev/connections/callback"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  # Always on: the in-process background sync scheduler (ADR 0010) only
  # runs while the machine is up, and Fly's default auto-stop would kill it
  # between requests.
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[deploy]
  # Runs once against the release, before traffic switches to the new
  # machine — the equivalent of the Makefile's `db-upgrade` prerequisite,
  # never inside the running app process (tasks/backlog.md's M0 note on
  # why `make run` depends on `db-upgrade` rather than upgrading at boot).
  release_command = "python -m alembic upgrade head"

[checks]
  [checks.health]
    type = "http"
    port = 8080
    path = "/health"
    interval = "15s"
    timeout = "5s"
