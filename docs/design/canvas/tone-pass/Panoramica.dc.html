<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #1B5E3F; } a:hover { color: #124A31; }
    .tnum { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
  </style>
</helmet>

<div style="background: #F2F5F3; width: 100%; box-sizing: border-box; padding: 20px 20px 32px;">

  <!-- title -->
  <div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px;">
    <h1 style="margin: 0; font-size: 32px; font-weight: 700; letter-spacing: -0.03em; color: #1C1C1E;">Panoramica</h1>
    <span style="font-size: 13px; font-weight: 600; color: #1B5E3F;">Settembre</span>
  </div>

  <!-- period control: quiet, on the background -->
  <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 16px;">
    <div style="width: 30px; height: 30px; border-radius: 9px; background: #FFFFFF; border: 1px solid rgba(60,60,67,0.10); display: flex; align-items: center; justify-content: center;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="#8E8E93" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div style="flex: 1; display: flex; background: #FFFFFF; border: 1px solid rgba(60,60,67,0.10); border-radius: 10px; padding: 3px;">
      <div style="flex: 1; text-align: center; font-size: 13px; font-weight: 600; color: #FFFFFF; background: #1B5E3F; border-radius: 7px; padding: 5px 0;">Mese</div>
      <div style="flex: 1; text-align: center; font-size: 13px; font-weight: 500; color: #6E6E73; padding: 5px 0;">Trimestre</div>
      <div style="flex: 1; text-align: center; font-size: 13px; font-weight: 500; color: #6E6E73; padding: 5px 0;">Anno</div>
    </div>
    <div style="width: 30px; height: 30px; border-radius: 9px; background: #FFFFFF; border: 1px solid rgba(60,60,67,0.10); display: flex; align-items: center; justify-content: center;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M9 5l7 7-7 7" stroke="#8E8E93" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
  </div>

  <!-- HERO -->
  <div style="border-radius: 22px; overflow: hidden; border: 1px solid rgba(60,60,67,0.06); box-shadow: 0 2px 6px rgba(0,0,0,0.05), 0 22px 44px -22px rgba(0,0,0,0.26); margin-bottom: 20px;">
    <div style="background: linear-gradient(150deg, #1B5E3F, #124A31); padding: 20px; color: #FFFFFF;">
      <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.10em; text-transform: uppercase; color: rgba(255,255,255,0.72);">Speso a settembre</div>
      <div class="tnum" style="display: flex; align-items: baseline; letter-spacing: -0.035em; margin-top: 8px;">
        <span style="font-size: 20px; font-weight: 600; color: rgba(255,255,255,0.72); letter-spacing: 0; margin-right: 4px;">&euro;</span>
        <span style="font-size: 46px; font-weight: 700;">1.284</span>
        <span style="font-size: 24px; font-weight: 700; color: rgba(255,255,255,0.72); letter-spacing: 0;">,50</span>
      </div>
      <div style="font-size: 12px; color: rgba(255,255,255,0.72); margin-top: 6px;">&darr; 12% rispetto ad agosto &middot; &euro;175/giorno</div>

      <!-- harmonized ribbon -->
      <div style="display: flex; height: 8px; border-radius: 999px; overflow: hidden; margin-top: 16px;">
        <div style="width: 31%; background: #3FBE85;"></div>
        <div style="width: 22%; background: #6BA6E8;"></div>
        <div style="width: 17%; background: #E07B72;"></div>
        <div style="width: 14%; background: #E08A4E;"></div>
        <div style="width: 16%; background: rgba(255,255,255,0.34);"></div>
      </div>
    </div>

    <div style="background: #FFFFFF; padding: 16px 20px; display: flex;">
      <div style="flex: 1;">
        <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #8E8E93;">Entrate</div>
        <div class="tnum" style="display: flex; align-items: baseline; margin-top: 3px; letter-spacing: -0.02em;">
          <span style="font-size: 13px; font-weight: 600; color: #248A3D; margin-right: 2px;">+</span>
          <span style="font-size: 19px; font-weight: 700; color: #248A3D;">3.200</span>
          <span style="font-size: 12px; font-weight: 600; color: #AEAEB2;">,00</span>
        </div>
      </div>
      <div style="width: 1px; background: rgba(60,60,67,0.10);"></div>
      <div style="flex: 1; padding-left: 16px;">
        <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #8E8E93;">Netto</div>
        <div class="tnum" style="display: flex; align-items: baseline; margin-top: 3px; letter-spacing: -0.02em;">
          <span style="font-size: 13px; font-weight: 600; color: #1B5E3F; margin-right: 2px;">+</span>
          <span style="font-size: 19px; font-weight: 700; color: #1B5E3F;">1.915</span>
          <span style="font-size: 12px; font-weight: 600; color: #AEAEB2;">,50</span>
        </div>
      </div>
    </div>
  </div>

  <!-- DETAIL: where the money went -->
  <div style="font-size: 13px; font-weight: 700; letter-spacing: -0.01em; color: #1C1C1E; margin: 0 2px 10px;">Dove sono andati</div>
  <div style="background: #FFFFFF; border: 1px solid rgba(60,60,67,0.08); border-radius: 18px; box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 8px 20px -14px rgba(0,0,0,0.14); overflow: hidden; margin-bottom: 20px;">
    <sc-for list="{{cats}}" as="c" hint-placeholder-count="4">
      <div style="padding: 12px 16px; border-bottom: 1px solid rgba(60,60,67,0.07); display: flex; align-items: center; gap: 12px;">
        <div style="width: 32px; height: 32px; border-radius: 10px; background: {{c.solid}}; display: flex; align-items: center; justify-content: center; flex: none;">
          <div style="width: 13px; height: 13px; border-radius: 4px; background: #FFFFFF;"></div>
        </div>
        <div style="flex: 1; min-width: 0;">
          <div style="display: flex; justify-content: space-between; align-items: baseline;">
            <span style="font-size: 14px; font-weight: 500; color: #1C1C1E;">{{c.name}}</span>
            <span class="tnum" style="font-size: 14px; font-weight: 700; color: #1C1C1E; letter-spacing: -0.02em;">{{c.amt}}</span>
          </div>
          <div style="height: 4px; border-radius: 999px; background: #EFEFF1; margin-top: 7px; overflow: hidden;">
            <div style="height: 100%; width: {{c.pct}}; background: {{c.solid}};"></div>
          </div>
        </div>
      </div>
    </sc-for>
    <div style="padding: 11px 16px; text-align: center; font-size: 13px; font-weight: 600; color: #1B5E3F;">Tutte le categorie</div>
  </div>

  <!-- trend, compact -->
  <div style="font-size: 13px; font-weight: 700; letter-spacing: -0.01em; color: #1C1C1E; margin: 0 2px 10px;">Andamento</div>
  <div style="background: #FFFFFF; border: 1px solid rgba(60,60,67,0.08); border-radius: 18px; box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 8px 20px -14px rgba(0,0,0,0.14); padding: 18px 16px;">
    <div style="display: flex; align-items: flex-end; gap: 5px; height: 72px;">
      <sc-for list="{{bars}}" as="b" hint-placeholder-count="14">
        <div style="flex: 1; border-radius: 3px 3px 0 0; background: {{b.color}}; height: {{b.h}};"></div>
      </sc-for>
    </div>
    <div style="display: flex; justify-content: space-between; margin-top: 8px; font-size: 11px; color: #AEAEB2;">
      <span>1 set</span><span>15 set</span><span>30 set</span>
    </div>
  </div>

</div>

<script data-dc-script data-props='{"$preview":{"width":390,"height":1520}}'>
class Component extends DCLogic {
  renderVals() {
    const heights = [40,55,30,62,48,80,35,52,44,70,58,33,66,50];
    return {
      cats: [
        { name: "Spesa e casa",      solid: "#009F63", amt: "‒398,20", pct: "62%" },
        { name: "Trasporti",         solid: "#4687DB", amt: "‒284,00", pct: "44%" },
        { name: "Ristoranti e bar",  solid: "#CF5E55", amt: "‒216,50", pct: "34%" },
        { name: "Abbonamenti",       solid: "#C96726", amt: "‒178,90", pct: "28%" }
      ],
      bars: heights.map((h, i) => ({ h: h + "px", color: i === 5 ? "#1B5E3F" : "#C9D9CF" }))
    };
  }
}
</script>
</body>
</html>
